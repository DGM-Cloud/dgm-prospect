services:
  db:
    image: postgis/postgis:16-3.4
    container_name: dgm-prospect-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dgm
      POSTGRES_PASSWORD: dgm_prospect_local
      POSTGRES_DB: dgm_prospect
    volumes:
      - dgm_prospect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgm -d dgm_prospect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dgm_prospect_pgdata:
